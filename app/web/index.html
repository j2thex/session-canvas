<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="canvas-token" content="{{TOKEN}}">
<meta name="canvas-dry-run" content="{{DRY_RUN}}">
<meta name="canvas-version" content="{{VERSION}}">
<meta name="canvas-name" content="{{APP_NAME}}">
<title>{{APP_NAME}}</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="stage">
  <canvas id="board" aria-label="Board of Claude sessions"></canvas>
  <div id="notes"></div>
</div>

<header id="top">
  <div class="brand" title="{{APP_NAME}}: every Claude Code session on one board">
    <span class="logo"></span><span class="name">{{APP_NAME}}</span>
  </div>
  <div class="seg" id="layouts" role="tablist" aria-label="Layout">
    <button data-layout="tree" title="Who started or continued whom (press 1)">Tree</button>
    <button data-layout="timeline" title="Days left to right: see progress (press 2)">Timeline</button>
    <button data-layout="free" title="Drag cards anywhere; places are remembered (press 3)">Free</button>
  </div>
  <label class="sel" title="What the card colour means">Colour
    <select id="colorBy">
      <option value="week">by week</option>
      <option value="project">by project</option>
      <option value="kind">by type</option>
    </select>
  </label>
  <button id="btnFilters" class="btn" title="Show only some sessions">Filters<span class="count" id="filterCount" hidden></span></button>

  <div id="search">
    <span class="mag"></span>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search titles, keywords and everything said…   press /">
    <span id="qcount"></span>
    <button id="qprev" class="mini" title="Previous match (Shift+Enter)" hidden>&#8249;</button>
    <button id="qnext" class="mini" title="Next match (Enter)" hidden>&#8250;</button>
    <div id="results" hidden></div>
  </div>

  <div class="right">
    <button id="btnSession" class="btn accent" title="Start a new Claude session, e.g. for the day (press S)">+ Session</button>
    <button id="btnNote" class="btn" title="Add a sticky note (press N, or double-click the board)">+ Note</button>
    <span class="group">
      <button id="btnBack" class="btn icon" title="Back to the previous focused session ( [ )" disabled>&#8249;</button>
      <button id="btnFwd" class="btn icon" title="Forward ( ] )" disabled>&#8250;</button>
    </span>
    <button id="btnUndo" class="btn" title="Undo the last move, delete or edit (Cmd+Z)" disabled>Undo</button>
    <button id="btnFit" class="btn" title="Show everything (press F)">Fit all</button>
    <button id="btnToday" class="btn" title="Jump to today / the newest session (press T)">Today</button>
    <button id="btnRescan" class="btn" title="Look for new sessions now (press R)"><span class="spin"></span>Rescan</button>
    <button id="btnTheme" class="btn icon" title="Light / dark"></button>
    <button id="btnHelp" class="btn icon" title="Help and keyboard shortcuts (press ?)">?</button>
  </div>
</header>

<div id="banner" hidden></div>
<div id="filters" class="pop" hidden></div>
<aside id="panel" hidden aria-label="Session details"></aside>
<div id="hovercard" hidden></div>
<div id="edgebar" class="floatbar" hidden></div>
<div id="notebar" class="floatbar" hidden></div>

<div id="mapwrap" title="Map of the whole board: click or drag to move">
  <canvas id="minimap" width="220" height="140"></canvas>
</div>
<div id="zoomctl">
  <button id="zoomOut" title="Zoom out (-)">&minus;</button>
  <button id="zoomPct" title="Back to 100% (0)">100%</button>
  <button id="zoomIn" title="Zoom in (+)">+</button>
</div>
<div id="legend"></div>
<footer id="status"></footer>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>

<div id="loading">
  <div class="box">
    <div class="logo big"></div>
    <div class="title">{{APP_NAME}}</div>
    <div class="msg" id="loadMsg">Reading your sessions…</div>
    <div class="bar"><i id="loadBar"></i></div>
  </div>
</div>

<script src="/util.js"></script>
<script src="/layout.js"></script>
<script src="/model.js"></script>
<script src="/draw.js"></script>
<script src="/panels.js"></script>
<script src="/setup.js"></script>
<script src="/ui.js"></script>
</body>
</html>
